# Build whisper.cpp (crate voice) with the AVX2 instructions: without them, ggml stays on SSE2
# and is about a third slower. The app refuses dictation on processors without AVX2.
# libclang (for bindgen) is a machine choice: LIBCLANG_PATH goes in the environment
# or in ~/.cargo/config.toml, not here.
#
# The optimization too. With the Visual Studio generator the cmake crate fills CMAKE_<C|CXX>_FLAGS_RELEASE itself
# and drops every /O flag: ggml compiled unoptimized and dictation took 24 s for 4 s of speech. whisper-rs-sys passes
# the CMAKE_* variables of the environment to cmake, and a variable already defined is not overwritten.
[env]
CMAKE_C_FLAGS_RELEASE = "-nologo -MD -Brepro -W0 /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/utf-8 -nologo -MD -Brepro -W0 /O2 /Ob2 /DNDEBUG"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
