<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mango Code</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main data-view="starting">
    <!-- Logo: the same as the icon (app/src-tauri/icons/mango.svg) -->
    <svg class="logo" viewBox="16 32 170 170" aria-hidden="true">
      <defs>
        <linearGradient id="peel" gradientUnits="userSpaceOnUse" x1="47" y1="59" x2="155" y2="178">
          <stop offset="0" stop-color="#FFD84A"/>
          <stop offset="0.5" stop-color="#FFA61F"/>
          <stop offset="1" stop-color="#F0532B"/>
        </linearGradient>
        <clipPath id="shape">
          <path d="M 96 52 C 142 40 182 78 176 126 C 171 166 134 190 94 184 C 66 180 44 172 24 150 C 34 150 42 144 44 132 C 46 92 62 60 96 52 Z"/>
        </clipPath>
      </defs>
      <g clip-path="url(#shape)" fill="url(#peel)">
        <rect x="0" y="44" width="150" height="9" rx="4.5"/>
        <rect x="0" y="57" width="182" height="9" rx="4.5"/>
        <rect x="0" y="70" width="128" height="9" rx="4.5"/>
        <rect x="0" y="83" width="170" height="9" rx="4.5"/>
        <rect x="0" y="96" width="182" height="9" rx="4.5"/>
        <rect x="0" y="109" width="112" height="9" rx="4.5"/>
        <rect x="0" y="122" width="160" height="9" rx="4.5"/>
        <rect x="0" y="135" width="182" height="9" rx="4.5"/>
        <rect x="0" y="148" width="140" height="9" rx="4.5"/>
        <rect x="0" y="161" width="120" height="9" rx="4.5"/>
        <rect x="0" y="174" width="182" height="9" rx="4.5"/>
        <rect x="0" y="187" width="150" height="9" rx="4.5"/>
      </g>
    </svg>

    <h1>Mango Code</h1>

    <!-- Startup in progress -->
    <section id="starting" aria-live="polite">
      <p class="subtitle" id="startup-title"></p>
      <ol class="steps" id="steps">
        <li data-step="startup"><span class="indicator"></span><span class="name" data-text="stepStartup"></span><span class="detail"></span></li>
        <li data-step="engine"><span class="indicator"></span><span class="name" data-text="stepEngine"></span><span class="detail"></span></li>
        <li data-step="voice" data-optional hidden><span class="indicator"></span><span class="name" data-text="stepVoice"></span><span class="detail"></span></li>
        <li data-step="agent"><span class="indicator"></span><span class="name" data-text="stepAgent"></span><span class="detail"></span></li>
        <li data-step="preparing" data-optional hidden><span class="indicator"></span><span class="name" data-text="stepPreparing"></span><span class="detail"></span></li>
      </ol>
      <p class="note" data-text="startupNote"></p>
    </section>

    <!-- Model choice: first run, or "Models and engine" from the tray icon -->
    <section id="choice" hidden>
      <p class="subtitle" id="choice-title"></p>
      <p class="explanation" id="choice-intro"></p>
      <h2 data-text="yourComputer"></h2>
      <dl class="computer" id="computer"></dl>
      <h2 data-text="models"></h2>
      <ul class="models" id="models"></ul>
      <p class="note" data-text="fastestNote"></p>
      <p class="note" id="optimize"><span data-text="optimizeIntro"></span> <button type="button" class="link" id="optimize-open" data-text="optimizeOpen"></button><br><code id="optimize-folder"></code></p>

      <h2 data-text="otherModels"></h2>
      <p class="explanation" id="other-intro" data-text="otherIntro"></p>
      <form class="search" id="other-form">
        <input type="text" id="other-text" data-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
        <button type="submit" class="secondary" id="other-search" data-text="search"></button>
        <button type="button" class="secondary" id="other-file" data-text="chooseFile"></button>
      </form>
      <p class="status" id="other-status" aria-live="polite"></p>
      <ul class="models" id="other-results"></ul>
      <div id="other-detail" hidden>
        <p class="model-name" id="other-name"></p>
        <ul class="warnings" id="other-warnings"></ul>
        <ul class="models" id="other-variants"></ul>
        <label class="images" id="other-images-row" hidden><input type="checkbox" id="other-images"> <span id="other-images-text"></span></label>
        <div class="actions">
          <button type="button" class="primary" id="other-add"></button>
          <button type="button" class="secondary" id="other-close" data-text="close"></button>
        </div>
      </div>
      <details id="other-token">
        <summary data-text="tokenSummary"></summary>
        <p class="note" data-text="tokenNote"></p>
        <form class="search" id="token-form">
          <input type="password" id="token-value" autocomplete="off" spellcheck="false">
          <button type="submit" class="secondary" id="token-save" data-text="save"></button>
          <button type="button" class="secondary" id="token-remove" data-text="remove" hidden></button>
        </form>
        <p class="status" id="token-status" aria-live="polite"></p>
      </details>

      <div class="controls">
        <p class="summary" id="summary" aria-live="polite"></p>
        <div class="actions">
          <button type="button" class="primary" id="start-download" disabled></button>
          <button type="button" class="secondary" id="cancel" data-text="cancel" hidden></button>
        </div>
        <p class="status" id="choice-status" aria-live="polite"></p>
      </div>
    </section>

    <!-- Download -->
    <section id="download" hidden aria-live="polite">
      <p class="subtitle" id="download-title"></p>
      <ol class="steps download" id="download-steps"></ol>
      <p class="note" data-text="downloadNote"></p>
    </section>

    <!-- Error -->
    <section id="error" hidden role="alert">
      <p class="subtitle" id="error-title"></p>
      <p class="explanation" id="error-sentence"></p>
      <p class="explanation" data-text="errorHint"></p>
      <details>
        <summary data-text="technicalDetails"></summary>
        <pre id="error-message"></pre>
        <button type="button" class="link" id="copy" data-text="copyDetails"></button>
      </details>
      <div class="actions">
        <button type="button" class="primary" id="retry" data-text="retry"></button>
        <button type="button" class="secondary" id="report" data-text="report"></button>
        <button type="button" class="secondary" id="logs" data-text="openLogs"></button>
      </div>
      <label class="screenshot" id="report-screenshot-row"><input type="checkbox" id="report-screenshot" checked> <span data-text="reportScreenshot"></span></label>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="first-run.js"></script>
</body>
</html>
