[package]
name = "mango-code"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mango_code_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mango-common.workspace = true
engine-cfg.workspace = true
agent-cfg.workspace = true
engine.workspace = true
phone.workspace = true
voice.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
ureq.workspace = true
webview2-com = "0.39"
chrono = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# To play the company filter in the tests (`mango_common::internet::fake_proxy`)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
