[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mango-common.workspace = true
engine-cfg.workspace = true
anyhow.workspace = true
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
ureq = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper"] }

# A fake llama-server (health, streaming, save): used by the manager tests and the integration test
# without GPUs.
[[bin]]
name = "fake-engine"
path = "src/bin/fake-engine.rs"
test = false

[dev-dependencies]
tempfile = "3.27.0"

# The speed bench: each model started the way the app starts it.
[[bin]]
name = "mango-bench"
path = "src/bin/mango-bench.rs"
test = false

# Tuning on the installer's PC: detects the hardware, measures a tune, keeps the log, writes the profile.
[[bin]]
name = "mango-tune"
path = "src/bin/mango-tune.rs"
test = false

# What the terminal (`launcher/mango-engine.ps1`) asks of the app's same logic: the engine plan of a model on this
# PC, the models with the context that fits, the download of engine and weights.
[[bin]]
name = "mango-launch"
path = "src/bin/mango-launch.rs"
test = false
