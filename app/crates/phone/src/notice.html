<!doctype html>
<html lang="{lang}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>{title}</title>
<style>
html { background: #15171f; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 24px;
  color: #f1f0eb;
  font: 17px/1.5 Inter, system-ui, -apple-system, sans-serif;
}
main { width: 100%; max-width: 420px; }
h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.2; }
p { margin: 0; color: #a9a8b4; }
</style>
<main>
  <h1>{title}</h1>
  <p>{text}</p>
</main>
